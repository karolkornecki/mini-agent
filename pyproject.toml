[project]
name = "mini-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karol Kornecki", email = "karol.kornecki@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langfuse>=4,<5",
    "openai>=3.49.0",
    "python-dotenv>=1.2.4",
    "unidiff>=1.0.1",
]

[project.scripts]
mini-agent = "mini_agent.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mini_agent"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
