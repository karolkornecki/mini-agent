[project]
name = "ai-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karol Kornecki", email = "karol.kornecki@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.49.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-agents = "ai_agents:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
